[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "driftwatch"
version = "0.1.0"
description = "Production ML Drift Detection and Statistically Guarded Retraining Platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "DriftWatch Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "xgboost>=2.1.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "mlflow>=2.15.0",
    "evidently>=0.4.30",
    "streamlit>=1.37.0",
    "plotly>=5.22.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "hypothesis>=6.110.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "E712", "UP042", "B905"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disable_error_code = ["assignment", "arg-type", "import-untyped", "no-any-return", "operator", "attr-defined", "return-value"]
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
